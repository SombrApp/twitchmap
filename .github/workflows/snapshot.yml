# twitchmap snapshot — rebuilds the map from live data and publishes data.json
# to the repo (which auto-redeploys the site). Runs every 6 hours.
name: snapshot

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours (~4x/day; stays under Cloudflare's 500 builds/mo cap)
  workflow_dispatch: {}         # manual "Run workflow" button

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: collector
        run: npm install
      - name: Build & publish snapshot
        working-directory: collector
        run: node src/snapshot.js
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}